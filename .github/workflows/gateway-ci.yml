name: gateway-ci

on:
  push:
    paths:
      - 'zhijing_edge_gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'zhijing_edge_gateway/**'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 -G：windows-latest 的 VS 版本会随 runner 更新，显式写 2022 会
      # 在装新版 VS 的 runner 上找不到实例；让 CMake 自动选最高版本
      - name: Configure (MSVC x64)
        run: cmake -S zhijing_edge_gateway -B build -A x64

      - name: Build (Release, /W4)
        run: cmake --build build --config Release

      - name: Self-test
        run: build\Release\zhijing_edge_gateway.exe --self-test
        shell: cmd
